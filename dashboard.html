<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>강남3구 아파트 실거래가 대시보드</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="assets/dashboard.css">
</head>
<body>

<header class="page-header">
  <h1>강남3구 아파트 실거래가 대시보드</h1>
  <p class="subtitle" id="subtitle">데이터 불러오는 중…</p>
</header>

<div class="control-bar">
  <div class="container">
    <div class="gu-toggles" id="guToggles"></div>
    <div class="search-wrap">
      <input type="text" class="search-input" id="searchInput" placeholder="단지명 또는 동 이름 검색 (예: 래미안, 반포동)" />
      <button class="search-clear" id="searchClear" aria-label="검색어 지우기">✕</button>
    </div>
  </div>
</div>

<main class="container">

  <section id="kpiSection">
    <div class="kpi-grid" id="kpiGrid">
      <div class="card"><div class="skeleton" style="height:70px"></div></div>
      <div class="card"><div class="skeleton" style="height:70px"></div></div>
      <div class="card"><div class="skeleton" style="height:70px"></div></div>
      <div class="card"><div class="skeleton" style="height:70px"></div></div>
    </div>
  </section>

  <section>
    <h2 class="section-title">자치구별 비교</h2>
    <div class="compare-grid">
      <div class="card chart-card">
        <p class="chart-title">구별 평균 매매가</p>
        <canvas id="avgPriceChart" height="260"></canvas>
      </div>
      <div class="card chart-card">
        <p class="chart-title">구별 거래량</p>
        <canvas id="volumeChart" height="260"></canvas>
      </div>
    </div>
  </section>

  <section>
    <h2 class="section-title">월별 평균가 추이</h2>
    <div class="card chart-card">
      <canvas id="trendChart" height="320"></canvas>
    </div>
  </section>

  <section>
    <h2 class="section-title">실거래 랭킹 / 검색</h2>
    <div class="table-header-row">
      <span class="table-count" id="tableCount"></span>
    </div>
    <div class="table-wrap">
      <table class="deals-table">
        <thead>
          <tr>
            <th class="sortable" data-sort="d">계약일<span class="arrow">▾</span></th>
            <th>자치구</th>
            <th>동</th>
            <th>단지명</th>
            <th class="sortable" data-sort="a">전용면적<span class="arrow">▾</span></th>
            <th>층</th>
            <th class="sortable num" data-sort="p" data-sort-active="true">거래금액<span class="arrow">▾</span></th>
            <th class="sortable num" data-sort="pp">평당가<span class="arrow">▾</span></th>
          </tr>
        </thead>
        <tbody id="dealsBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" hidden>검색 결과가 없습니다. 다른 단지명을 입력해 보세요.</div>
    </div>
    <div class="table-footer">
      <button class="more-btn" id="moreBtn" hidden>더 보기 (+50)</button>
    </div>
  </section>

</main>

<footer class="page-footer">
  데이터 기준: 2025-07 ~ 2026-06, 국토교통부 아파트 실거래가(매매) · 강남구/서초구/송파구 ·
  <a href="index.html">← 포트폴리오로 돌아가기</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="assets/dashboard.js"></script>
</body>
</html>
